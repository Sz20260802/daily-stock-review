<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日股票复盘报告</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="header-row">
        <div>
          <h1>📈 每日股票复盘报告</h1>
          <div class="meta" id="header-meta">加载中…</div>
        </div>
        <div class="date-picker">
          <select id="date-select">
            <option value="latest">最新</option>
          </select>
          <button id="btn-latest">🔄 刷新</button>
        </div>
      </div>
      <nav class="tabs">
        <a href="#market">市场总览</a>
        <a href="#themes">主题复盘</a>
        <a href="#calendar">事件日历</a>
        <a href="#correlations">关联图谱</a>
        <a href="#insights">关键洞察</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div id="loading" style="text-align:center;padding:60px 0;">
      <div style="font-size:18px;color:#6b7280;">⏳ 正在加载复盘数据…</div>
    </div>
    <div id="error" class="notice error" hidden></div>

    <section class="section" id="market">
      <h2>市场总览</h2>
      <div id="market-content"></div>
    </section>

    <section class="section" id="themes">
      <h2>主题复盘</h2>
      <div id="themes-content"></div>
    </section>

    <section class="section" id="calendar">
      <h2>事件日历</h2>
      <div id="calendar-content"></div>
    </section>

    <section class="section" id="correlations">
      <h2>关联图谱</h2>
      <div id="correlations-content"></div>
    </section>

    <section class="section" id="insights">
      <h2>关键洞察</h2>
      <div id="insights-content"></div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>⚠️ 本应用仅供学习研究，不构成任何投资建议。数据来源于东方财富等公开渠道。</p>
      <p style="margin-top:4px;">自动生成于 GitHub Actions · 前端零依赖托管于 GitHub Pages</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
